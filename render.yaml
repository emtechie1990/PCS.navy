# Render Blueprint — one web service per site. Secrets live in the shared Environment Group `pcs-shared` (Render dashboard).
services:
  - type: web
    name: pcs-navy
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: BRAND
        value: navy
      - key: DB_NAME
        value: pcs_navy
      - key: APP_URL
        value: https://pcs.navy
      - key: SITE_HOSTS
        value: pcs.navy,www.pcs.navy
      - key: CORS_ORIGINS
        value: https://pcs.navy,https://www.pcs.navy
      - key: EMAIL_FROM
        value: no-reply@pcs.navy
      - key: EMAIL_FROM_NAME
        value: PCS.navy
      - key: ADMIN_EMAIL
        value: prescottmanisela@gmail.com
      - fromGroup: pcs-shared  # MONGO_URL, ADMIN_INITIAL_PASSWORD, RESEND_API_KEY, PAYMENTS_ENABLED, STRIPE_*, PAYPAL_* (set once in the Render dashboard)
